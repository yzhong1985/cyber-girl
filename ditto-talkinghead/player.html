<!doctype html><html lang=zh><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>cyber girl</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Microsoft YaHei",sans-serif}
 /* 背景层: 暗色柔光渐变(想换成场景图: 给 #stage 设 background-image 即可) */
 #stage{position:fixed;inset:0;overflow:hidden;
   background:radial-gradient(ellipse 70% 60% at 50% 34%, #2b2e3c 0%, #191a22 52%, #0b0b0f 100%)}
 /* 透明人像(待命循环 / 回复视频): 居中铺满高度, 靠自身微动"活" */
 .avatar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
   height:100vh;max-width:100vw;object-fit:contain;z-index:1;background:transparent}
 /* 待命时的"呼吸"起伏——纯CSS缩放模拟, 跟实际口型/表情不同步, 看起来假,
    先关掉(--breath设成1=缩放前后一样, 动画还在跑但视觉上没有效果; 想彻底
    去掉可以把 #idle 的 animation 那行也删了) */
 :root{ --breath:1; --breath-time:4.5s; }
 #idle{transform-origin:50% 100%;
   animation:breathe var(--breath-time) ease-in-out infinite}
 @keyframes breathe{
   0%,100%{transform:translate(-50%,-50%) scaleY(1)}
   50%    {transform:translate(-50%,-50%) scaleY(var(--breath))}}
 #vid{display:none}
 #hud{position:fixed;left:12px;top:10px;color:#8a8aa0;font-size:13px;z-index:3}
 #hud b{color:#9fc4ff}
 #mic{color:#6a6a80;margin-top:2px}
 #progWrap{display:none;width:160px;height:4px;background:#26263a;border-radius:2px;margin-top:5px;overflow:hidden}
 #progBar{width:0%;height:100%;background:#5a8fd6;transition:width .3s ease}
 #cap{position:fixed;left:0;right:0;bottom:22px;text-align:center;color:#d8d8e6;
   font-size:15px;z-index:3;padding:0 16px;text-shadow:0 1px 3px #000}
 #gate{position:fixed;inset:0;background:#0b0b0fcc;display:flex;align-items:center;justify-content:center;
   cursor:pointer;z-index:4}
 #gate div{color:#e8e8ef;font-size:18px;padding:14px 26px;border:1px solid #33334a;border-radius:12px;background:#16161f}
 /* 顶部设置栏: 输入模式切换 + 过渡语开关, z-index比gate还高, 进入前就能先选好 */
 #settings{position:fixed;right:12px;top:10px;z-index:6;display:flex;gap:10px;align-items:center;
   font-size:12px;color:#8a8aa0}
 .segControl{display:flex;border:1px solid #33334a;border-radius:8px;overflow:hidden}
 .segBtn{background:#16161f;color:#8a8aa0;border:none;padding:6px 10px;font-size:12px;cursor:pointer;
   font-family:inherit}
 .segBtn.on{background:#2a3550;color:#9fc4ff}
 .swLabel{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;white-space:nowrap}
 /* 角色管理面板(8900)只监听 127.0.0.1(本机管理用, 不对局域网开放), 所以这个
    链接只在本机访问本页时才显示, 局域网设备看到也点不通, 索性藏起来 */
 #panelLink{color:#6a8fc0;text-decoration:none;border:1px solid #33334a;border-radius:8px;padding:6px 10px}
 #panelLink:hover{color:#9fc4ff;border-color:#4a7fd4}
 /* 按住说话按钮: 底部居中悬浮圆按钮, 只在"按住说话"模式下显示 */
 #pttBtn{display:none;position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;
   width:76px;height:76px;border-radius:50%;border:2px solid #4a7fd4;background:#1e2a3fcc;
   color:#9fc4ff;font-size:12px;cursor:pointer;user-select:none;touch-action:none}
 #pttBtn.active{background:#4a7fd4;color:#fff;transform:translateX(-50%) scale(1.08)}
</style></head><body>
<div id=stage>
  <video id=idle class=avatar src="/video/idle_loop.mp4" loop muted autoplay playsinline></video>
  <video id=vid class=avatar playsinline></video>
</div>
<div id=hud>cyber girl · <b id=st>待命</b><div id=mic></div><div id=progWrap><div id=progBar></div></div></div>
<div id=cap></div>
<div id=settings>
  <div class=segControl id=modeToggle>
    <button class=segBtn data-mode=continuous>持续聆听</button>
    <button class=segBtn data-mode=ptt>按住说话</button>
  </div>
  <label class=swLabel><input type=checkbox id=fillerChk> 过渡语</label>
  <label class=swLabel><input type=checkbox id=streamChk> 分句流式</label>
  <a id=panelLink href="http://127.0.0.1:8900/" target=_blank style=display:none>管理角色</a>
</div>
<button id=pttBtn>按住<br>说话</button>
<div id=gate><div>▶ 点击进入(会请求麦克风权限)</div></div>
<script>
 const idle=document.getElementById('idle'), vid=document.getElementById('vid'),
       st=document.getElementById('st'), gate=document.getElementById('gate'),
       micEl=document.getElementById('mic'), capEl=document.getElementById('cap');
 const q=[]; let playing=false, ready=false;
 // 角色管理面板(8900)只监听127.0.0.1: 只要浏览器跟服务在同一台机器上就永远
 // 连得通, 跟这个对话页本身是用127.0.0.1还是局域网IP打开的无关——所以不猜
 // 地址, 直接探测连不连得通(局域网设备/手机探测会失败, 链接保持隐藏)
 fetch('http://127.0.0.1:8900/', {mode:'no-cors', cache:'no-store'})
   .then(()=>{ document.getElementById('panelLink').style.display=''; })
   .catch(()=>{});
 // ---- 画面来源: ditto(SSE推mp4段, 待命/说话两段视频切换) 或
 //      livetalking(WebRTC连续流, 一条流自带待命+说话, 不用切换) ----
 // avatar_service.py 的 /backend_info 告诉我们现在是哪种; 老版本没有这个
 // 端点(404/网络错误)时按 ditto 处理, 向后兼容不升级 avatar_service.py 也能用。
 function initDitto(){
   const IDLE_RATE=0.2;                 // 待命头部动作速度(1=原速, 越小越慢越稳)
   idle.playbackRate=IDLE_RATE;
   idle.play().catch(()=>{});
   function showIdle(){
     vid.style.display='none'; vid.pause();
     idle.style.display='block'; idle.playbackRate=IDLE_RATE; idle.play().catch(()=>{}); st.textContent='待命';
   }
   function pump(){
     if(playing||!ready) return;
     const next=q.shift();
     if(!next){showIdle(); return;}
     playing=true; st.textContent='说话中';
     vid.muted=false;
     // 先把新视频加载到"有画面可播"了, 再隐藏待命循环——反过来做(先隐藏待命,
     // 再等新视频加载)中间会有一小段两个<video>都没画面, 背景色露出来就是那个
     // "闪一下"。loadeddata 是第一帧解码好、可以出画面的最早时机。
     vid.onloadeddata=()=>{
       vid.onloadeddata=null;
       idle.pause(); idle.style.display='none';
       vid.style.display='block';
       vid.play().catch(()=>{playing=false;});
     };
     vid.src=next;
   }
   vid.onended=()=>{playing=false; showIdle(); pump();};
   vid.onerror=()=>{playing=false; showIdle(); pump();};
   const es=new EventSource('/events');
   es.onmessage=e=>{
     try{
       const d=JSON.parse(e.data);
       if(d.video){
         // 过渡语视频固定 /video/filler_*.mp4 命名, 跟正式回复 /video/seg_*.mp4
         // 天然可区分; 开关关了就直接跳过不播(纯前端, 不用通知后端)
         if(!fillerEnabled && d.video.includes('/video/filler_')) return;
         q.push(d.video); pump();
       }
     }catch(_){}
   };
   return { onGateOpen(){ idle.play().catch(()=>{}); pump(); } };
 }

 function initLiveTalking(livetalkingUrl){
   // 没有独立待机视频文件——LiveTalking 一条 WebRTC 流本身就连续包含待机和
   // 说话两种状态, 不需要 ditto 那套 idle/vid 双元素切换, 复用 #vid 常驻显示。
   idle.style.display='none';
   let pc=null, connecting=false;
   function waitIce(p){
     if(p.iceGatheringState==='complete') return Promise.resolve();
     return new Promise(res=>{
       const t=setTimeout(res,3000);
       p.addEventListener('icegatheringstatechange',()=>{
         if(p.iceGatheringState==='complete'){clearTimeout(t); res();}
       });
     });
   }
   async function connect(){
     if(pc||connecting) return;
     connecting=true; st.textContent='连接中';
     try{
       pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
       pc.addTransceiver('video',{direction:'recvonly'});
       pc.addTransceiver('audio',{direction:'recvonly'});
       pc.ontrack=e=>{
         vid.srcObject=e.streams[0];
         vid.style.display='block';
         vid.muted=false;
         vid.play().catch(()=>{});
       };
       pc.onconnectionstatechange=()=>{
         if(!pc) return;
         if(['failed','closed','disconnected'].includes(pc.connectionState)){
           st.textContent='连接断开, 重连中…'; pc=null;
           setTimeout(connect, 3000);
         }else if(pc.connectionState==='connected'){
           st.textContent='已连接';
         }
       };
       await pc.setLocalDescription(await pc.createOffer());
       await waitIce(pc);
       const r=await fetch(livetalkingUrl+'/offer', {
         method:'POST', headers:{'Content-Type':'application/json'},
         body: JSON.stringify({sdp:pc.localDescription.sdp, type:pc.localDescription.type})
       });
       if(!r.ok) throw new Error('offer HTTP '+r.status);
       const ans=await r.json();
       await pc.setRemoteDescription(ans);
     }catch(e){
       st.textContent='连接失败, 重试中…'; pc=null;
       setTimeout(connect, 5000);
     }finally{ connecting=false; }
   }
   return { onGateOpen(){ connect(); } };
 }

 let playback=null;
 const backendReady = fetch('/backend_info', {cache:'no-store'}).then(r=>r.json())
   .then(d=>({backend:d.backend||'ditto', livetalkingUrl:d.livetalking_url||''}))
   .catch(()=>({backend:'ditto', livetalkingUrl:''}));   // 老版本没有这个端点, 按ditto走

 gate.onclick=async ()=>{
   ready=true; gate.style.display='none';
   const {backend, livetalkingUrl} = await backendReady;
   playback = backend==='livetalking' ? initLiveTalking(livetalkingUrl) : initDitto();
   playback.onGateOpen();
   startMic();
 };

 // ---- 设置: 输入模式(持续聆听/按住说话) + 过渡语开关, 记 localStorage ----
 let inputMode = localStorage.getItem('cg_input_mode') || 'continuous';
 let fillerEnabled = localStorage.getItem('cg_filler') !== '0';   // 默认开
 const pttBtn=document.getElementById('pttBtn'), fillerChk=document.getElementById('fillerChk'),
       streamChk=document.getElementById('streamChk');
 fillerChk.checked = fillerEnabled;

 function applyModeUI(){
   document.querySelectorAll('.segBtn').forEach(b=>b.classList.toggle('on', b.dataset.mode===inputMode));
   pttBtn.style.display = inputMode==='ptt' ? 'block' : 'none';
 }
 applyModeUI();
 document.querySelectorAll('.segBtn').forEach(b=>{
   b.onclick=()=>{
     inputMode=b.dataset.mode; localStorage.setItem('cg_input_mode', inputMode);
     pttActive=false; applyModeUI();
   };
 });
 fillerChk.onchange=()=>{
   fillerEnabled=fillerChk.checked;
   localStorage.setItem('cg_filler', fillerEnabled ? '1' : '0');
 };

 // 分句流式播放: 跟过渡语开关不一样, 这个是真的要影响语音管线怎么生成回复,
 // 不是纯前端的事——状态存在 Ditto 服务那边(/settings), 语音管线每次处理新
 // 回复前会现查一次, 所以这里改了下一句回复就按新设置生成, 不用重启。
 // 初始状态从服务端拿(不是localStorage), 因为它是服务端说了算的实际状态。
 fetch('/settings', {cache:'no-store'}).then(r=>r.json()).then(d=>{
   streamChk.checked = !!d.stream_sentences;
 }).catch(()=>{});
 streamChk.onchange=()=>{
   fetch(`/settings?stream_sentences=${streamChk.checked ? 1 : 0}`, {method:'POST'}).catch(()=>{});
 };

 // 按住说话: 按住时才真正把音频发出去; 松开后再"多发"一小段(采集到的多半是
 // 环境静音), 让服务端现成的 VAD 静默判定(>500ms)自然收尾——不用额外发协议
 // 消息去"强制结束一句", 复用现有机制。
 let pttActive=false, pttTailTimer=null;
 const PTT_TAIL_MS=700;
 function pttStart(e){ e.preventDefault(); clearTimeout(pttTailTimer); pttActive=true; pttBtn.classList.add('active'); }
 function pttEnd(e){
   e.preventDefault(); pttBtn.classList.remove('active'); clearTimeout(pttTailTimer);
   pttTailTimer=setTimeout(()=>{ pttActive=false; }, PTT_TAIL_MS);
 }
 pttBtn.addEventListener('pointerdown', pttStart);
 pttBtn.addEventListener('pointerup', pttEnd);
 pttBtn.addEventListener('pointercancel', pttEnd);
 pttBtn.addEventListener('pointerleave', pttEnd);

 // ---- 网页版: 浏览器采麦, 经 WebSocket 发给语音管线(端口约定 8765) ----
 const WS_PORT = 8765;
 const WORKLET_SRC = `
   class PCMWorklet extends AudioWorkletProcessor {
     constructor(){
       super();
       this._chunks=[]; this._len=0;
       // sampleRate 是 AudioWorkletGlobalScope 全局, 即 AudioContext 实际运行的采样率。
       // 请求 new AudioContext({sampleRate:16000}) 只是"提示", 部分浏览器(尤其 iOS
       // Safari)会不认, 实际还是给原生48k/44.1k——这里统一按实际值重采样到16k,
       // 不管浏览器听不听那个请求都能拿到服务端要的16kHz。
       this._ratio = sampleRate / 16000;
     }
     _to16k(f32){
       // process()给的 raw 缓冲区下次调用就会被复用/覆写, 这里必须返回拷贝
       if(this._ratio === 1) return f32.slice();
       const outLen = Math.max(1, Math.floor(f32.length / this._ratio));
       const out = new Float32Array(outLen);
       for(let i=0;i<outLen;i++){
         const pos = i*this._ratio, i0 = Math.floor(pos), i1 = Math.min(i0+1, f32.length-1);
         const frac = pos - i0;
         out[i] = f32[i0]*(1-frac) + f32[i1]*frac;
       }
       return out;
     }
     process(inputs){
       const raw = inputs[0] && inputs[0][0];
       if(raw && raw.length){
         const ch = this._to16k(raw);
         this._chunks.push(ch);
         this._len += ch.length;
         if(this._len >= 512){
           const merged = new Float32Array(this._len);
           let off=0;
           for(const c of this._chunks){ merged.set(c, off); off+=c.length; }
           const nFrames = Math.floor(this._len/512)*512;
           const send = merged.subarray(0, nFrames);
           const rest = merged.subarray(nFrames);
           const pcm16 = new Int16Array(send.length);
           for(let i=0;i<send.length;i++){
             const s = Math.max(-1, Math.min(1, send[i]));
             pcm16[i] = s<0 ? s*32768 : s*32767;
           }
           this.port.postMessage(pcm16.buffer, [pcm16.buffer]);
           this._chunks = rest.length ? [rest] : [];
           this._len = rest.length;
         }
       }
       return true;
     }
   }
   registerProcessor('pcm-worklet', PCMWorklet);
 `;

 // 起服务时 Ditto 形象服务(8902,这个页面)比语音管线(8765, STT/LLM/TTS都要加载,
 // 常常要多等一两分钟)先就绪——不这样处理的话人是能看到了但说话完全没反应,
 // 会以为坏了。这里 WS 连不上/断开都自动重试, 同时轮询 /startup_status 显示
 // 加载进度条(语音管线自己上报到 Ditto 服务缓存的, 见 avatar_service.py)。
 let ws = null, wsRetryTimer = null, statusPollTimer = null, polling = false;
 const WS_RETRY_MS = 2500, STATUS_POLL_MS = 1500;
 const progWrap=document.getElementById('progWrap'), progBar=document.getElementById('progBar');

 async function pollStartupStatus(){
   if(ws){ polling = false; return; }   // 已连上就不用再轮询了
   try{
     const r = await fetch('/startup_status', {cache:'no-store'});
     const d = await r.json();
     if(!ws && d.percent < 100){
       progWrap.style.display = 'block';
       progBar.style.width = d.percent + '%';
       micEl.textContent = `语音服务启动中: ${d.stage}(${d.percent}%)`;
     }
   }catch(_){ /* avatar_service 都还没起来的极早期, 忽略 */ }
   statusPollTimer = setTimeout(pollStartupStatus, STATUS_POLL_MS);
 }

 function connectWS(){
   let sock;
   try{
     const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
     sock = new WebSocket(`${wsProto}://${location.hostname}:${WS_PORT}`);
     sock.binaryType = 'arraybuffer';
   }catch(e){
     micEl.textContent = '语音服务连接失败, 2.5s后重试…';
     wsRetryTimer = setTimeout(connectWS, WS_RETRY_MS);
     return;
   }
   let openedOnce = false;
   sock.onopen = ()=>{
     openedOnce = true; ws = sock; micEl.textContent = '聆听中';
     progWrap.style.display = 'none';
     polling = false;
     clearTimeout(statusPollTimer);
   };
   sock.onclose = ()=>{
     ws = null;
     micEl.textContent = openedOnce
       ? '连接已断开, 重连中…'
       : '语音服务启动中…';
     wsRetryTimer = setTimeout(connectWS, WS_RETRY_MS);
     if(!openedOnce && !polling){ polling = true; pollStartupStatus(); }
   };
   sock.onerror = ()=>{ /* onclose 紧跟着会触发, 提示统一交给 onclose 处理 */ };
   sock.onmessage = (e)=>{
     if(typeof e.data !== 'string') return;   // 二进制音频帧: avatar模式不用, 忽略
     try{
       const d = JSON.parse(e.data);
       if(d.type === 'assistant_text' && d.text){ capEl.textContent = d.text; }
     }catch(_){}
   };
 }

 async function startMic(){
   micEl.textContent = '连接语音服务…';
   connectWS();

   let stream;
   try{
     stream = await navigator.mediaDevices.getUserMedia({
       audio:{channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true}
     });
   }catch(e){
     micEl.textContent = '麦克风未授权(点地址栏图标允许)'; return;
   }

   const audioCtx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
   const blobURL = URL.createObjectURL(new Blob([WORKLET_SRC], {type:'application/javascript'}));
   await audioCtx.audioWorklet.addModule(blobURL);
   const src = audioCtx.createMediaStreamSource(stream);
   const node = new AudioWorkletNode(audioCtx, 'pcm-worklet');
   // 引用的是外层可变的 ws 变量(不是某次连接的快照), 断线重连后自动跟着换新连接发送。
   // 持续聆听模式: 一直发; 按住说话模式: 只有按住(含松开后的尾巴延迟)才发。
   node.port.onmessage = (e)=>{
     if(!ws || ws.readyState !== WebSocket.OPEN) return;
     if(inputMode === 'continuous' || pttActive) ws.send(e.data);
   };
   src.connect(node);
   // AudioWorkletNode 必须连到 destination 所在的图里, process() 才会被浏览器持续调用
   // (没连到输出的"悬空"节点很多实现里根本不会拉动处理); 接一个增益0的节点静音,
   // 避免麦克风声音被回放出来(回声/啸叫)。
   const mute = audioCtx.createGain();
   mute.gain.value = 0;
   node.connect(mute);
   mute.connect(audioCtx.destination);
 }
</script></body></html>
