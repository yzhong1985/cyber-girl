<!doctype html><html lang=zh><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>cyber girl</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Microsoft YaHei",sans-serif}
 /* 背景层: 暗色柔光渐变(想换成场景图: 给 #stage 设 background-image 即可) */
 #stage{position:fixed;inset:0;overflow:hidden;
   background:radial-gradient(ellipse 70% 60% at 50% 34%, #2b2e3c 0%, #191a22 52%, #0b0b0f 100%)}
 /* 透明人像(待命循环 / 回复视频): 居中铺满高度, 靠自身微动"活" */
 .avatar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
   height:100vh;max-width:100vw;object-fit:contain;z-index:1;background:transparent}
 /* 待命时给一点“呼吸”起伏(纯上下缩放, 不旋转不歪), 让身体也似乎在轻微动 */
 :root{ --breath:1.018; --breath-time:4.5s; }
 #idle{transform-origin:50% 100%;
   animation:breathe var(--breath-time) ease-in-out infinite}
 @keyframes breathe{
   0%,100%{transform:translate(-50%,-50%) scaleY(1)}
   50%    {transform:translate(-50%,-50%) scaleY(var(--breath))}}
 #vid{display:none}
 #hud{position:fixed;left:12px;top:10px;color:#8a8aa0;font-size:13px;z-index:3}
 #hud b{color:#9fc4ff}
 #mic{color:#6a6a80;margin-top:2px}
 #cap{position:fixed;left:0;right:0;bottom:22px;text-align:center;color:#d8d8e6;
   font-size:15px;z-index:3;padding:0 16px;text-shadow:0 1px 3px #000}
 #gate{position:fixed;inset:0;background:#0b0b0fcc;display:flex;align-items:center;justify-content:center;
   cursor:pointer;z-index:4}
 #gate div{color:#e8e8ef;font-size:18px;padding:14px 26px;border:1px solid #33334a;border-radius:12px;background:#16161f}
</style></head><body>
<div id=stage>
  <video id=idle class=avatar src="/video/idle_loop.mp4" loop muted autoplay playsinline></video>
  <video id=vid class=avatar playsinline></video>
</div>
<div id=hud>cyber girl · <b id=st>待命</b><div id=mic></div></div>
<div id=cap></div>
<div id=gate><div>▶ 点击进入(会请求麦克风权限)</div></div>
<script>
 const idle=document.getElementById('idle'), vid=document.getElementById('vid'),
       st=document.getElementById('st'), gate=document.getElementById('gate'),
       micEl=document.getElementById('mic'), capEl=document.getElementById('cap');
 const q=[]; let playing=false, ready=false;
 const IDLE_RATE=0.2;                 // 待命头部动作速度(1=原速, 越小越慢越稳)
 idle.playbackRate=IDLE_RATE;
 idle.play().catch(()=>{});
 gate.onclick=()=>{ready=true; gate.style.display='none'; idle.play().catch(()=>{}); pump(); startMic();};
 function showIdle(){
   vid.style.display='none'; vid.pause();
   idle.style.display='block'; idle.playbackRate=IDLE_RATE; idle.play().catch(()=>{}); st.textContent='待命';
 }
 function pump(){
   if(playing||!ready) return;
   const next=q.shift();
   if(!next){showIdle(); return;}
   playing=true; st.textContent='说话中';
   idle.pause(); idle.style.display='none';
   vid.style.display='block'; vid.muted=false; vid.src=next; vid.play().catch(()=>{playing=false;});
 }
 vid.onended=()=>{playing=false; showIdle(); pump();};
 vid.onerror=()=>{playing=false; showIdle(); pump();};
 const es=new EventSource('/events');
 es.onmessage=e=>{try{const d=JSON.parse(e.data); if(d.video){q.push(d.video); pump();}}catch(_){}};

 // ---- 网页版: 浏览器采麦, 经 WebSocket 发给语音管线(端口约定 8765) ----
 const WS_PORT = 8765;
 const WORKLET_SRC = `
   class PCMWorklet extends AudioWorkletProcessor {
     constructor(){
       super();
       this._chunks=[]; this._len=0;
       // sampleRate 是 AudioWorkletGlobalScope 全局, 即 AudioContext 实际运行的采样率。
       // 请求 new AudioContext({sampleRate:16000}) 只是"提示", 部分浏览器(尤其 iOS
       // Safari)会不认, 实际还是给原生48k/44.1k——这里统一按实际值重采样到16k,
       // 不管浏览器听不听那个请求都能拿到服务端要的16kHz。
       this._ratio = sampleRate / 16000;
     }
     _to16k(f32){
       // process()给的 raw 缓冲区下次调用就会被复用/覆写, 这里必须返回拷贝
       if(this._ratio === 1) return f32.slice();
       const outLen = Math.max(1, Math.floor(f32.length / this._ratio));
       const out = new Float32Array(outLen);
       for(let i=0;i<outLen;i++){
         const pos = i*this._ratio, i0 = Math.floor(pos), i1 = Math.min(i0+1, f32.length-1);
         const frac = pos - i0;
         out[i] = f32[i0]*(1-frac) + f32[i1]*frac;
       }
       return out;
     }
     process(inputs){
       const raw = inputs[0] && inputs[0][0];
       if(raw && raw.length){
         const ch = this._to16k(raw);
         this._chunks.push(ch);
         this._len += ch.length;
         if(this._len >= 512){
           const merged = new Float32Array(this._len);
           let off=0;
           for(const c of this._chunks){ merged.set(c, off); off+=c.length; }
           const nFrames = Math.floor(this._len/512)*512;
           const send = merged.subarray(0, nFrames);
           const rest = merged.subarray(nFrames);
           const pcm16 = new Int16Array(send.length);
           for(let i=0;i<send.length;i++){
             const s = Math.max(-1, Math.min(1, send[i]));
             pcm16[i] = s<0 ? s*32768 : s*32767;
           }
           this.port.postMessage(pcm16.buffer, [pcm16.buffer]);
           this._chunks = rest.length ? [rest] : [];
           this._len = rest.length;
         }
       }
       return true;
     }
   }
   registerProcessor('pcm-worklet', PCMWorklet);
 `;

 // 起服务时 Ditto 形象服务(8902,这个页面)比语音管线(8765, STT/LLM/TTS都要加载,
 // 常常要多等一两分钟)先就绪——不这样处理的话人是能看到了但说话完全没反应,
 // 会以为坏了。这里 WS 连不上/断开都自动重试, 用文字提示是不是还在启动。
 let ws = null, wsRetryTimer = null;
 const WS_RETRY_MS = 2500;

 function connectWS(){
   let sock;
   try{
     const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
     sock = new WebSocket(`${wsProto}://${location.hostname}:${WS_PORT}`);
     sock.binaryType = 'arraybuffer';
   }catch(e){
     micEl.textContent = '语音服务连接失败, 2.5s后重试…';
     wsRetryTimer = setTimeout(connectWS, WS_RETRY_MS);
     return;
   }
   let openedOnce = false;
   sock.onopen = ()=>{ openedOnce = true; ws = sock; micEl.textContent = '聆听中'; };
   sock.onclose = ()=>{
     ws = null;
     micEl.textContent = openedOnce
       ? '连接已断开, 重连中…'
       : '语音服务启动中(常需1~2分钟), 自动重试…';
     wsRetryTimer = setTimeout(connectWS, WS_RETRY_MS);
   };
   sock.onerror = ()=>{ /* onclose 紧跟着会触发, 提示统一交给 onclose 处理 */ };
   sock.onmessage = (e)=>{
     if(typeof e.data !== 'string') return;   // 二进制音频帧: avatar模式不用, 忽略
     try{
       const d = JSON.parse(e.data);
       if(d.type === 'assistant_text' && d.text){ capEl.textContent = d.text; }
     }catch(_){}
   };
 }

 async function startMic(){
   micEl.textContent = '连接语音服务…';
   connectWS();

   let stream;
   try{
     stream = await navigator.mediaDevices.getUserMedia({
       audio:{channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true}
     });
   }catch(e){
     micEl.textContent = '麦克风未授权(点地址栏图标允许)'; return;
   }

   const audioCtx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
   const blobURL = URL.createObjectURL(new Blob([WORKLET_SRC], {type:'application/javascript'}));
   await audioCtx.audioWorklet.addModule(blobURL);
   const src = audioCtx.createMediaStreamSource(stream);
   const node = new AudioWorkletNode(audioCtx, 'pcm-worklet');
   // 引用的是外层可变的 ws 变量(不是某次连接的快照), 断线重连后自动跟着换新连接发送
   node.port.onmessage = (e)=>{ if(ws && ws.readyState === WebSocket.OPEN) ws.send(e.data); };
   src.connect(node);
   // AudioWorkletNode 必须连到 destination 所在的图里, process() 才会被浏览器持续调用
   // (没连到输出的"悬空"节点很多实现里根本不会拉动处理); 接一个增益0的节点静音,
   // 避免麦克风声音被回放出来(回声/啸叫)。
   const mute = audioCtx.createGain();
   mute.gain.value = 0;
   node.connect(mute);
   mute.connect(audioCtx.destination);
 }
</script></body></html>
